# PFM run configuration — ROOT copy.
#
# ALL relative paths here resolve against THIS FILE'S folder (the repo root, e.g.
# /p/projects/elevate/WP3.4 on the cluster), NOT the working directory. So use
# root-relative paths without a leading `../` — a `../` here climbs out of the project.
#
# Read by pfm::pfmResolveConfig(), which pfm::pfmRun() calls before showing its plan:
#
#   pfmRun(group = "v5", stage = "downstream", config = "config.yml")
#
# Every run reads the madrat block (its cache is checked before any step). The scenario
# registry is read by the steps that use scenario gdxs - pfm-projection and pfm-coupling-bound.

# ── madrat data cache ────────────────────────────────────────────────────────────
# ONE prepared cache feeds the historical panel, the estimation, the projection AND the
# coupling (the REMIND export stages the coupling's subset into each run folder), so all of
# them read the same data versions. pfm::pfmPrepareCache() checks and fills it; it runs from
# tools/setup.sh --install and at the start of every pfmRun(). ADR 0047; docs/RUNNING.md step 2.
#
#   cachefolder     the project cache. {group} is replaced by the Run-Group, so each group
#                   gets its own folder (data/madrat/v5, data/madrat/v6, ...) holding exactly
#                   one version of each calculation. Use a fixed tag instead
#                   ("data/madrat/2026-10") for groups that must share one cache.
#   cacheSources    caches to COPY a missing file from, searched in this order. Only files the
#                   pipeline actually looks up are copied, chosen by madrat's own rule.
#   sourcefolder    madrat RAW sources, for what no cache has (then COMPUTED). Candidates:
#                   the first that exists on this machine wins, so workstation and cluster
#                   paths can both be listed here.
#   useMadratConfig also use madrat's own configured cachefolder (as the last copy source)
#                   and sourcefolder (when no candidate above exists). On the PIK cluster that
#                   is the shared input-data cache and sources.
#   compute         FALSE = check only: a file in no cache is an error, nothing is computed.
# (Older configs with a top-level `cachefolder:`/`sourcefolder:` still work.)
madrat:
  cachefolder: "data/madrat/{group}"
  cacheSources:
    - "data/madrat/legacy"                                # the pre-2026-10-01 flat project cache
    - "C:/_data/work/remind_input_data/cache/default"     # workstation REMIND input cache
    - "/p/tmp/benke/clean-cache-aug"                      # cluster: a clean cache, read before madrat's own
  sourcefolder:
    - "C:/_data/work/remind_input_data/sources"           # workstation
  useMadratConfig: true
  compute: true

# ── Panel spatial resolution ─────────────────────────────────────────────────────
# The unit set the historical panel is aggregated to before anything is fitted.
# "country"  — no aggregation (the project default since 2026-08-25)
# "regionmapping_54.csv" — 54 regions; what Run-Group v3 was built at
#
# 🔴 THIS IS NOT A DISPLAY SETTING. Every min-max normalised quantity is normalised
# over whatever units are in frame, so u — and hence phi, and hence the theta anchor —
# is a DIFFERENT OBJECT at each resolution. Measured: the efficiency anchor moves
# 0.744 (country) -> 0.396 (region) on the same fit. See MODEL.md 5.3 and PITFALLS 15.
#
# Two Run-Groups at different resolutions are NOT COMPARABLE, and the difference is
# silent: both complete, both look fine. Check `panel_hash` in each manifest.json
# before differencing anything across groups.
#
# pfmRun() threads this to every pfm step, so the fit and the projection cannot drift
# apart; it prints as `panel res` in the plan. Override per-run with
# outputRegionMappingFile= on the call.
outputRegionMappingFile: "country"

# ── Panel definition ─────────────────────────────────────────────────────────────
# Which years the historical panel spans, whether it is smoothed, and which IEA World Energy
# Balances edition its energy drivers come from (pfm::pfmPanelDef; docs/DATA.md §3).
#   years           first and last panel year
#   movingAverage   centred window in years; 1 = annual values
#   ieaVersion      default = IEA 2024 edition (complete to 2022); latest = 2025 edition
#                   (complete to 2023). 2023 needs latest.
#   geothermal      count geothermal with hydro and nuclear in the clean-baseload control
#                   ("Hydro Nuclear Share"; design note 0005 A4). Legacy (v5): false.
#   democracy       add the V-Dem democracy indices: electoral (v2x_polyarchy), liberal (v2x_libdem) and
#                   freedom of expression and alternative information (v2x_freexp_altinf), the candidate
#                   weights of a democracy-weighted spec (design note 0007). Up to v6: false.
#   groups          per-Run-Group overrides of the keys above
#
# Read ONLY for a group that has not been swept yet: the sweep records the definition in the
# group's manifest.json and every later step - the projection, the REMIND export and the
# coupled run - reads it from there. A group swept before the record existed (v5 and
# earlier) keeps the legacy definition: 2000-2022, 5-year moving average, IEA 2024 edition.
# Editing this block never changes a swept group. pfmRun() prints it as `panel` in the plan.
panel:
  years: [2000, 2023]
  movingAverage: 5
  ieaVersion: latest
  geothermal: true
  groups:
    # Sibling of v6 on annual values - the robustness rung of the smoothing (0005 D3).
    v6-annual:
      movingAverage: 1
    # v7 (design note 0007): the V-Dem democracy indices enter the panels, the candidate weights of the
    # democracy-weighted interactions. Held at their last observed value in scenarios.
    # overallAccountability: V-Dem's overall accountability (v2x_accountability_osp, the PoliClim index) enters
    # the panels as one more accountability channel, normalised and projected like the other V-Dem channels
    # (communication/institutional-indicators; analysis/checks/policlimFormulation.R).
    v7:
      democracy: true
      overallAccountability: true
    # the theory-gate sensitivities of ADR 0059 (accepted 2026-10-25): the same panel as v7, so the sweep re-selects
    # from v7's cached fits (seed data/madrat/<group> with a copy of data/madrat/v7 first; RUNNING Step 6c)
    v7-h3070:
      democracy: true
      overallAccountability: true
    v7-h3080:
      democracy: true
      overallAccountability: true
    v7-p10:
      democracy: true
      overallAccountability: true

# ── Sweep: actor-power form and its extrapolation gate (design note 0005 D7) ─────────
# Arguments of pfm::runPFMSweep(). Like `panel`, read ONLY for a group not swept yet: the sweep
# records them in manifest.json (sweepOptions); v5 and earlier keep the v5 grid (linear + satAP
# twins, no actor-power extrapolation gate). pfmRun() prints them as `sweep` in the plan.
#   apTransforms          the actor-power forms every split actor-power spec is fitted in:
#                         linear | saturating (both groups) | saturating-innovator |
#                         saturating-incumbent. Selection chooses among them (D7, options 1C/2C).
#   dropCompositeAP       drop the composite Actor Power Index specs, which cannot be
#                         saturated (D7, option 3A)
#   apExtrapolationGate   severe in the sanity walk when more than this share of in-coverage
#                         country-years in apExtrapolationWindow has an actor-power driver more
#                         than apExtrapolationSd training SDs beyond its support - on the gating
#                         OR the reference projection. Saturating columns are guarded at their
#                         physical domain and pass by construction. 0.275 is the tolerance of
#                         the existing support-share gate (ADR 0045); both values are declared.
#   softVifGate           within-band soft keys of the maximin order (ADR 0048): a number, or
#   inferenceTGate        "off". Both off from v6: the VIF key demoted the designed collinearity
#                         of incumbent share and baseload control, and decided the institutional
#                         channels; the |t| key decided v6 on a 0.04 margin. The hard VIF gate
#                         (10) stays. Quote "off": unquoted, YAML reads it as false (also off).
#                         Omitted = runPFMSweep's defaults, 6 and 2.33 (every group up to v5).
#   interactionWeights    panel variables (0-1) that each add a weighted twin of every spec with interactions
#                         ("none" keeps the unweighted specs); design note 0007, option O10
#   edgeGate              the edge-of-data gate of the sanity walk: "off", on (declared defaults), or a mapping of
#                         share / effect / capShift / cap / mapping (design note 0007 section 5)
#   extraAccountability   extra options of the accountability slot, crossed like vertical / horizontal / diagonal:
#                         "OvAcc" = V-Dem overall accountability (needs panel: overallAccountability: true)
#   groups                per-Run-Group overrides, as for panel
sweep:
  apTransforms: [linear, saturating, saturating-innovator, saturating-incumbent]
  dropCompositeAP: true
  apExtrapolationGate: 0.275
  apExtrapolationSd: 1
  apExtrapolationWindow: [2025, 2100]
  softVifGate: "off"
  inferenceTGate: "off"
  groups:
    # v7 (design note 0007): every spec with interactions gets one democracy-weighted twin per listed weight, and the
    # sanity walk applies the edge-of-data gate at its declared thresholds (0007 section 5):
    #   share     a region fails when countries holding this share of its final energy have fossil dependence or
    #             clean-energy build-out acting against the frontier's reading ...
    #   effect    ... by at least this many logit units of ceiling between 2025 and 2100 (in a sector whose
    #             sample-centre sign agrees with the reading);
    #   capShift  or when capping the interactions' moderators at the sample's `cap` percentiles moves a
    #             region's final-energy-weighted ceiling (level in 2025 or change to 2100) by more than this;
    #   mapping   the regions the shares are read in.
    # Fixed by the author on 2026-10-21 at these values; edgeGate: "off" disables the gate.
    # interactionWeights (author's choice 2026-10-21): freedom of expression and electoral democracy, as alternatives
    # the search chooses between (0007 section 10):
    #   "Freedom of Expression (VDem)"  freedom of expression and alternative information  twin suffix " iw:fexp"
    #   "Electoral Democracy (VDem)"    electoral democracy                                  twin suffix " iw:poly"
    #   "Liberal Democracy (VDem)"      liberal democracy (in the panels; not listed)        twin suffix " iw:libdem"
    # Each listed weight adds one copy of every spec with interactions. "none" keeps the unweighted specs.
    # Scope (design note 0007 sections 8-9): a weight as named multiplies every interest x institution term (A3).
    # With "@accRoL" it weights only the accountability and rule-of-law terms and leaves the state-capability terms
    # unweighted (A7; twin suffix " iw:fexp@accRoL"). A scoped twin is added only to specs that interact with state
    # capability and with accountability or rule of law (elsewhere it would repeat another spec).
    # v7 grid: 36,384 specs, about 5.0x v6's 7,296 (A3 weights and OvAcc alone: 27,648, 3.8x). To drop A7, delete
    # the two "@accRoL" entries; to drop OvAcc, delete extraAccountability here and overallAccountability in panel.
    # extraAccountability: overall accountability ("OvAcc", the PoliClim index) as a fifth option of the
    # accountability slot. It adds the four institution sets with OvAcc (19 sets instead of 15): about 1.27x
    # the grid on its own, about 3.8x v6 together with the two weights.
    v7:
      interactionWeights: [none, "Freedom of Expression (VDem)", "Electoral Democracy (VDem)",
                           "Freedom of Expression (VDem)@accRoL", "Electoral Democracy (VDem)@accRoL"]
      extraAccountability: [OvAcc]
      edgeGate:
        share: 0.25
        effect: 0.25
        capShift: 0.5
        cap: [0.05, 0.95]
        mapping: regionmapping_21_EU11.csv
      # theoryGate (design note 0007 section 15; ADR 0059, accepted 2026-10-25): the hypotheses a selected spec must show, from
      # the political economy of the transition (ADR 0056). H1-H2 screen the ranked pool on the fits; H3 is severe in
      # the sanity walk.
      #   p            significance level (cluster-robust p of the fits)
      #   structural   H1: fossil dependence lowers the ceiling at typical institutions, in every sector
      #   contingency  H2: the fossil effect depends on institutions (a fossil x institution term at p / their
      #                number, Bonferroni), in every sector; the sign is free
      #   coherence    H3: the fossil effect, interactions included, is negative in at least this share of the
      #                estimation rows (refuses large offsetting interaction terms)
      theoryGate:
        p: 0.05
        structural: true
        contingency: true
        coherence: 0.75
    # Theory-gate sensitivities (ADR 0059 acceptance): v7's sweep options in full, one threshold changed. Written out,
    # not merged with a YAML anchor: R's yaml lets a merged key override the group's own.
    v7-h3070:   # H3 coherence 0.70
      interactionWeights: [none, "Freedom of Expression (VDem)", "Electoral Democracy (VDem)",
                           "Freedom of Expression (VDem)@accRoL", "Electoral Democracy (VDem)@accRoL"]
      extraAccountability: [OvAcc]
      edgeGate:
        share: 0.25
        effect: 0.25
        capShift: 0.5
        cap: [0.05, 0.95]
        mapping: regionmapping_21_EU11.csv
      # theoryGate (design note 0007 section 15; ADR 0059, accepted 2026-10-25): the hypotheses a selected spec must show, from
      # the political economy of the transition (ADR 0056). H1-H2 screen the ranked pool on the fits; H3 is severe in
      # the sanity walk.
      #   p            significance level (cluster-robust p of the fits)
      #   structural   H1: fossil dependence lowers the ceiling at typical institutions, in every sector
      #   contingency  H2: the fossil effect depends on institutions (a fossil x institution term at p / their
      #                number, Bonferroni), in every sector; the sign is free
      #   coherence    H3: the fossil effect, interactions included, is negative in at least this share of the
      #                estimation rows (refuses large offsetting interaction terms)
      theoryGate:
        p: 0.05
        structural: true
        contingency: true
        coherence: 0.70
    v7-h3080:   # H3 coherence 0.80
      interactionWeights: [none, "Freedom of Expression (VDem)", "Electoral Democracy (VDem)",
                           "Freedom of Expression (VDem)@accRoL", "Electoral Democracy (VDem)@accRoL"]
      extraAccountability: [OvAcc]
      edgeGate:
        share: 0.25
        effect: 0.25
        capShift: 0.5
        cap: [0.05, 0.95]
        mapping: regionmapping_21_EU11.csv
      # theoryGate (design note 0007 section 15; ADR 0059, accepted 2026-10-25): the hypotheses a selected spec must show, from
      # the political economy of the transition (ADR 0056). H1-H2 screen the ranked pool on the fits; H3 is severe in
      # the sanity walk.
      #   p            significance level (cluster-robust p of the fits)
      #   structural   H1: fossil dependence lowers the ceiling at typical institutions, in every sector
      #   contingency  H2: the fossil effect depends on institutions (a fossil x institution term at p / their
      #                number, Bonferroni), in every sector; the sign is free
      #   coherence    H3: the fossil effect, interactions included, is negative in at least this share of the
      #                estimation rows (refuses large offsetting interaction terms)
      theoryGate:
        p: 0.05
        structural: true
        contingency: true
        coherence: 0.80
    v7-p10:   # H1-H2 at p 0.10
      interactionWeights: [none, "Freedom of Expression (VDem)", "Electoral Democracy (VDem)",
                           "Freedom of Expression (VDem)@accRoL", "Electoral Democracy (VDem)@accRoL"]
      extraAccountability: [OvAcc]
      edgeGate:
        share: 0.25
        effect: 0.25
        capShift: 0.5
        cap: [0.05, 0.95]
        mapping: regionmapping_21_EU11.csv
      # theoryGate (design note 0007 section 15; ADR 0059, accepted 2026-10-25): the hypotheses a selected spec must show, from
      # the political economy of the transition (ADR 0056). H1-H2 screen the ranked pool on the fits; H3 is severe in
      # the sanity walk.
      #   p            significance level (cluster-robust p of the fits)
      #   structural   H1: fossil dependence lowers the ceiling at typical institutions, in every sector
      #   contingency  H2: the fossil effect depends on institutions (a fossil x institution term at p / their
      #                number, Bonferroni), in every sector; the sign is free
      #   coherence    H3: the fossil effect, interactions included, is negative in at least this share of the
      #                estimation rows (refuses large offsetting interaction terms)
      theoryGate:
        p: 0.10
        structural: true
        contingency: true
        coherence: 0.75

# ── Policy Scenario Registry (ADR 0035) ──────────────────────────────────────────
# The REMIND pathways the one shared Fitted Model is projected onto. Each entry:
#   id                a stable key — the projection-artifact stem and report/figure key.
#                     These MATCH models/remind_pfm/config/scenario_config_PFM.csv so reports,
#                     figure legends and the coupled runs key off the same names.
#   name              human-readable label used in reports and the manuscript
#   gdx               path to that scenario's fulldata.gdx
#   gdxRegionMapping  the mapping matching THAT GDX'S OWN native resolution. This is a
#                     property of the gdx, not a target: an H12 gdx stays H12 here even
#                     though the coupling is delivered at EU21. Getting it wrong
#                     mis-assigns every region, silently.
#   ssp               the run's SSP (its cm_GDPpopScen); drives the scenario panel's GDP,
#                     population and SSP-extension series. Default SSP2.
#   institutions      how the institution series with no SSP projection are projected:
#                     convergence (default) | storyline | hold. pfm::pfmInstitutionProjection;
#                     docs/DATA.md §5.
#
# The SSP2 pair below (the gating entry = PkBudg1000, the other = NPi) is also what every offline
# v6 analysis reads (analysis/v6/bases.R). Move it to new REMIND bases ONLY with
# analysis/v6/refreshBases.R, which snapshots the old results and re-runs those analyses
# (PITFALLS.md 34). Until then, both runs below are the Run-Group v5 uncoupled baselines
# (REMIND 3.7.0.dev29), EU21 (regionmapping_21_EU11.csv),
# stored under output/remind-runs/<Run-Group>/<resolution>/. NOTE the carbon budget
# also changed when the runs moved to EU21 — 1000 Gt, not the 750 Gt of the earlier
# H12 pair — so price levels are NOT comparable with anything quoted from H12 results.
scenarios:
  - id: SSP2-NPi2025-PFMbase
    name: "Current Policies (P_ref)"
    gdx: "output/remind-runs/v6/EU21/SSP2-EU21-NPi2025_2026-10-07_12.36.43/fulldata.gdx"
    gdxRegionMapping: "regionmapping_21_EU11.csv"
    ssp: SSP2
    aliases: ["national-policies"]

  - id: SSP2-PkBudg1000-PFMref
    name: "Climate Ambition (reference twin)"
    gdx: "output/remind-runs/v6/EU21/SSP2-EU21-PkBudg1000_2026-10-07_19.04.46/fulldata.gdx"
    gdxRegionMapping: "regionmapping_21_EU11.csv"
    ssp: SSP2
    aliases: ["climate-ambition", "SSP2-PkBudg1000-PFMref"]

# The one scenario whose projection drives model selection (the Projection-Sanity and
# clamp-reliance gates): the high-ambition pathway, because it is the stress test.
# Selection runs once against it; every scenario is projected.
#
# It is ALSO the ambitious pathway runPFMCouplingBound() bounds against — P_opt — with
# the reference (P_ref) taken from the non-gating scenario. Declaring it here rather
# than inferring it from the id matters: a registry carrying both PkBudg750 and
# PkBudg1000 would otherwise resolve to whichever was listed first.
gatingScenario: SSP2-PkBudg1000-PFMref

# Legacy single-scenario fallback, used ONLY when `scenarios:` is absent. If you ever
# see the projection running against this rather than the registry above, the registry
# failed to resolve and the result is a projection of the wrong pathway.
gdxPath: "data/fulldata.gdx"

# ── Storage ──────────────────────────────────────────────────────────────────────
# Fit Cache / model store (ADR 0009): models/, panels/, index.json. Content-addressed
# and SHARED across Run-Groups — this is what makes a new group over an unchanged
# panel cheap. The `modelDir` argument of the pfm run* functions.
modelDir: "output/pfm/fit-cache"

# Results Root (ADR 0018): curated per-Run-Group artifacts, <resultsDir>/<group>/.
resultsDir: "output/pfm"

# Reproduction records, one folder per Run-Group, TRACKED in git (output/ is not): the madrat
# cache record and pin (ADR 0047). records/README.md.
recordsDir: "records"

# Default Run-Group. Override per call with pfmRun(group = "...").
# v6 since 2026-10-07: a bare tools/setup.sh --install or pfmRun() must never touch the frozen v5
# cache or its tracked record (records/v5/), which today's code would rewrite (PITFALLS.md §35).
group: "v6"

# Removed 2026-10-02 (design note 0005 E15), read by no code: outputDir and dashboardModelsDir
# (the archived pfm-reports), couplingRegionMapping (the coupling delivers at the REMIND run's
# own cfg$regionmapping, set by preparePFM.R), and the retired hurdle model's modelName,
# regionMappingFE, includeLagged, adoptionThreshold.

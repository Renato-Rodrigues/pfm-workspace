  # `Rscript analysis/v8/emissionsBand.R v8 stage`. Start tag V8BANDEU21 (2 rows).
  # Unblocked 2026-11-23 (design note 0012 sec. 12): pfm 80f5423 (no NaN share for a zero 2025 gap), the bootstrap re-evaluated
  # on the coupled anchor; edges 0.1138 (resample 177) and 0.2221 (resample 94), mean constraint 2050, central 0.1333.
  # The two groups are staged on the workstation and copied to the cluster (docs/RUNNING.md).

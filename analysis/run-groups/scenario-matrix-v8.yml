  # ---------------------------------------------------------------- Option N0, a test (design note 0012 sec. 7, D13): current
  # policies with their regional prices replaced from 2030 by ONE globally uniform price that meets the same cumulative CO2
  # 2020-2100 as the current-policies run (2981.4 Gt at EU21, pm_actualbudgetco2 of SSP2-EU21-NPi2025, read 2026-11-23).
  # Uncoupled. REMIND's recipe for a uniform end-of-century budget (main.gms, 45_carbonprice): functionalForm,
  # cm_iterative_target_adj 5, cm_taxCO2_regiDiff 0 (none), cm_taxCO2_interpolation 0 (none; this REMIND takes 0|1|2, not "off"), lower bound off, cm_peakBudgYr 2100.
  # Start tag V8NPIBUDEU21 (1 row). Open: whether the budget loop converges on a budget that has not peaked by 2100.
  # cm_taxCO2_historical 14.3 (2026-11-23): the linear path starts from the emissions-weighted mean of the current-policy prices in
  # 2025 (pm_taxCO2eq x vm_emiAll of the NPi run), not REMIND's default, the HIGHEST regional price (71.9, ECS): with that default
  # the 20 $/t start aborts (functionalForm/datainput.gms l. 89) and the uniform price could never fall below the EU's.

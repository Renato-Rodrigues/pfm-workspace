# The v8 coupled batch: every row in one start tag per resolution, so a single standby submission per resolution queues
# the whole batch (ADR 0055 format; design note 0009; ADRs 0061, 0062, 0063).
# v8 = v7's ceiling search with the fossil terms bounded below (fossilFloors 0.05), the World Bank fossil rents setting the
# size of the buildings & transport slack (slackDrivers), the uncovered countries at the covered median E (coverage: median).
# Central coupling settings, on every coupled row (the `coupled:` block):
#   pfmPhiStrength: regional   each region's constraint fades with its own gap (ADR 0062 decision 5)
#   pfmInstitutions: gapclosure the SSP2 institution rule (ADR 0063)
#
# Run titles carry the labels the paper uses (from v8 on; docs/SCENARIOS.md 2.6):
#   SSP2[-EU21]-PkBudg1000-PFM-<closure>[-theta<NNN>][-<variant>]-v8
#   closure   noPolitics-holdBudget / noPolitics-holdPrice   the no-politics references (theta = 0)
#             holdPrice / holdBudget                         the two closures
#   theta     none = 0.50 (the headline); -theta325, -theta675
#   variant   none = the fading limit, regional strength, gap-closure institutions (the central case);
#             commonStrength, gapFirst, rentsWorldPrice, constantLimit, growingLimit, erosion2 / erosion2p7 / erosion5
#             (2% / 2.7% / 5% a year), erosionHistorical, institutionsHeld / institutionsAndrijevic /
#             institutionsStoryline, shrinkingFuture<start year>
# The analysis scripts translate a title to the internal key of the earlier batches (-PFMlevelBfix, -PFMlevelC, Th325,
# -Ehold, -kappa ...) in one place, analysis/coupled/_runKey.R; keys in this file are `<closure>-<variant>`.
#
# What runs, and why (the v7 batches and the ADRs):
#   nulls          the no-politics references: the comparator of every row and the anchor of hold the price
#   theta          the declared severities 0.325 / 0.50 / 0.675, both closures, both resolutions
#   strength       the common strength (v7's form, ADR 0062) and the gap-first form (the order of the steps of the meeting
#                  of 2026-10-09: gap, then normalisation with the 2023 range held, then theta)
#   rents          REMIND's rents at the world price (ADR 0061)
#   persistence    the ladder the spine rests on (design note 0006): constant limit, erosion 2.7% (both resolutions), 2%
#                  and 5%, the growing limit (ADR 0057), and the historical per-sector rates (Supplementary Note S-kappa)
#   institutions   held at 2023 (every batch), Andrijevic's government effectiveness (ADR 0063), the previous storyline
#                  rule ("quick convergence")
#   sequential     the shrinking future (Elmar, 2026-10-09; version B of the email of 2026-10-29): a chain of runs, each
#                  fixing the past to the previous step (cm_startyear, path_gdx_ref) and capping the price only in its own
#                  10-year window (pfmPhiWindowEnd), the rest of the future planned unconstrained; the last step's window
#                  stays open. The reference price comes from the current-policy run (cm_pfmRefPrice = refpolicycost), because
#                  path_gdx_ref is the previous step. The chain stops at 2070, before the 1000 Gt pathway's peak-budget
#                  year (2080): a hold-the-budget step that starts after it has no budget left to adjust. The result of
#                  the chain is its last step (-shrinkingFuture2070). EU21, theta 0.50, both closures.
#
# Start points (what v7 taught): every row starts from the no-politics reference (@noPolitics), not from another
# politics row. In v7 five hold-the-budget rows did not peak from a cold start and two more from a politics start
# (PITFALLS 26, SCENARIOS.md 3.4); starting all from @noPolitics also leaves one dependency only, so the whole batch runs
# side by side once -PFM-noPolitics-holdBudget finishes. The sequential steps start from the step before them (they
# must: it is their past).
#
# Build:  Rscript analysis/run-groups/buildPFMScenarioConfig.R analysis/run-groups/scenario-matrix-v8.yml
# It writes models/remind_pfm/config/scenario_config_PFM_v8.csv (a build artifact: edit this file, rebuild, commit both).
# The parents are the REMIND 3.7.1 bases already run (EU21BASE, H12BASE); the tags never start them.
#
# Start tags: V8W1EU21 (34 rows), V8W1H12 (18 rows); the sequential steps from 2040 on, after both 2040 steps aborted
# on the start price (2026-10-30; their 2030 steps finished in V8W1EU21): V8SEQEU21 (the 4 hold-the-price steps,
# submitted 2026-10-30 and chaining) and V8RERUNEU21 (the 4 hold-the-budget steps, re-submitted after the 2040 step
# aborted again: the GAMS rebuild of the cap read P_ref from the previous step, fixed by cm_pfmRefPrice). Every coupled
# row carries pfmGroup v8 and needs output/remind-inputs/v8. Re-runs get their own tag (V8RERUN<res>), so a
# re-submission never re-runs the batch.

format: pfm-scenario-matrix/1
output: config/scenario_config_PFM_v8.csv
canonical: config/scenario_config.csv
version: v8
ssps: [SSP2]
thetaDefault: "0.50"
thetaPrefix: "-theta"                 # 0.325 -> -theta325 (paper: severity theta)
markupLabel: "-markupOff"

resolutions:
  EU21:
    infix: EU21
    set:
      regionmapping: ./config/regionmapping_21_EU11.csv
      extramappings_historic: ./config/extramapping_EU27.csv
    baseStart: [EU21BASE]
  H12:
    infix: ""
    set: {}
    baseStart: [H12BASE]

parents:
  NPi2025:
    from: NPi2025
    set:
      cm_taxCO2_lowerBound_path_gdx_ref: "0"
  PkBudg1000:
    from: PkBudg1000
    set:
      cm_taxCO2_lowerBound_path_gdx_ref: "0"
      path_gdx_ref: "@NPi2025"
      path_gdx_refpolicycost: "@NPi2025"

coupled:                              # on every coupled row
  cm_taxCO2_regiDiff: "11"
  cm_pfmConvTol: "0.002"
  cm_pfmSectorMarkup: "1"
  cm_pfmGapClosure: "0"               # lambda is out of the coupling (ADR 0050)
  cm_pfmPhiPath: "1"                  # the share path (ADR 0054)
  pfmGroup: v8
  pfmPhiStrength: regional            # central for v8 (ADR 0062)
  pfmInstitutions: gapclosure         # central (ADR 0063)

rules:
  noPolitics:                         # no-politics reference (theta = 0), budget held, proportional mode
    stem: PFM-noPolitics-holdBudget
    set: {cm_pfmBindMode: "1", cm_pfmTheta: "0"}
  noPoliticsPrice:                    # no-politics reference, price held: anchor pinned from the budget-held one
    stem: PFM-noPolitics-holdPrice
    set: {cm_iterative_target_adj: "0", cm_pfmBindMode: "1", cm_pfmTheta: "0", cm_pfmAnchorFromGdx: "on",
          path_gdx_carbonprice: "@noPolitics"}
  holdPrice:                          # hold the price: level cap, anchor pinned from the no-politics reference
    stem: PFM-holdPrice
    set: {cm_iterative_target_adj: "0", cm_pfmBindMode: "2", cm_pfmAnchorFromGdx: "on",
          path_gdx_carbonprice: "@noPolitics"}
  holdBudget:                         # hold the budget: level cap rebuilt in GAMS every iteration
    stem: PFM-holdBudget
    set: {cm_pfmBindMode: "2", cm_pfmBoundRebuild: "1"}

runs:
  # ---------------------------------------------------------------- the no-politics references
  - {key: noPolitics, wave: 1, section: v8_nulls, parent: PkBudg1000, rule: noPolitics, warm: null,
     description: "No-politics reference (theta = 0) with v8's anchor, budget held: must reproduce -PFMgateRef within SCENARIOS.md 3.1. Anchor, price donor and start point of every row."}
  - {key: noPoliticsPrice, wave: 1, section: v8_nulls, parent: PkBudg1000, rule: noPoliticsPrice, warm: "@noPolitics",
     description: "No-politics reference (theta = 0), price held: the comparator of every hold-the-price row."}

  # ---------------------------------------------------------------- the headline and the theta sweep
  - {key: holdPrice, wave: 1, section: v8_theta, parent: PkBudg1000, rule: holdPrice, theta: ["0.50", "0.325", "0.675"], warm: "@noPolitics",
     description: "Hold the price, fading limit, regional strength, gap-closure institutions (theta 0.50 is the v8 headline, extra CO2 against -PFM-noPolitics-holdPrice)."}
  - {key: holdBudget, wave: 1, section: v8_theta, parent: PkBudg1000, rule: holdBudget, theta: ["0.50", "0.325", "0.675"], warm: "@noPolitics",
     description: "Hold the budget, fading limit, regional strength, gap-closure institutions."}

  # ---------------------------------------------------------------- the form of the strength
  - {key: holdPrice-commonStrength, wave: 1, section: v8_strength, parent: PkBudg1000, rule: holdPrice, theta: "0.50",
     variant: commonStrength, options: {pfmPhiStrength: common}, warm: "@noPolitics",
     description: "Hold the price, common strength (v7's form): what the regional strength changes (ADR 0062)."}
  - {key: holdBudget-commonStrength, wave: 1, section: v8_strength, parent: PkBudg1000, rule: holdBudget, theta: "0.50",
     variant: commonStrength, options: {pfmPhiStrength: common}, warm: "@noPolitics",
     description: "Hold the budget, common strength (v7's form)."}
  - {key: holdPrice-gapFirst, wave: 1, section: v8_strength, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21],
     variant: gapFirst, options: {pfmPhiStrength: gapfirst}, warm: "@noPolitics",
     description: "Hold the price, gap first: the projected gap normalised with the 2023 range held, then theta (meeting of 2026-10-09)."}
  - {key: holdBudget-gapFirst, wave: 1, section: v8_strength, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21],
     variant: gapFirst, options: {pfmPhiStrength: gapfirst}, warm: "@noPolitics",
     description: "Hold the budget, gap first (meeting of 2026-10-09)."}

  # ---------------------------------------------------------------- the rents
  - {key: holdPrice-rentsWorldPrice, wave: 1, section: v8_rents, parent: PkBudg1000, rule: holdPrice, theta: "0.50",
     variant: rentsWorldPrice, options: {pfmRentsPrice: world}, warm: "@noPolitics",
     description: "Hold the price, REMIND's rents valued at the world price (ADR 0061 sensitivity)."}
  - {key: holdBudget-rentsWorldPrice, wave: 1, section: v8_rents, parent: PkBudg1000, rule: holdBudget, theta: "0.50",
     variant: rentsWorldPrice, options: {pfmRentsPrice: world}, warm: "@noPolitics",
     description: "Hold the budget, REMIND's rents valued at the world price (ADR 0061 sensitivity)."}

  # ---------------------------------------------------------------- the persistence ladder (design note 0006)
  - {key: holdPrice-constantLimit, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21],
     variant: constantLimit, options: {pfmPhiHold: ratio}, warm: "@noPolitics",
     description: "Hold the price, constant limit: today's limit kept."}
  - {key: holdBudget-constantLimit, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21],
     variant: constantLimit, options: {pfmPhiHold: ratio}, warm: "@noPolitics",
     description: "Hold the budget, constant limit: today's limit kept."}
  - {key: holdPrice-erosion2p7, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdPrice, theta: "0.50",
     variant: erosion2p7, options: {pfmPhiKappa: "0.027"}, warm: "@noPolitics",
     description: "Hold the price, fading + erosion 2.7% a year (the central erosion rate, ADR 0050)."}
  - {key: holdBudget-erosion2p7, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdBudget, theta: "0.50",
     variant: erosion2p7, options: {pfmPhiKappa: "0.027"}, warm: "@noPolitics",
     description: "Hold the budget, fading + erosion 2.7% a year."}
  - {key: holdPrice-erosion2, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21],
     variant: erosion2, options: {pfmPhiKappa: "0.02"}, warm: "@noPolitics",
     description: "Hold the price, fading + erosion 2% a year."}
  - {key: holdBudget-erosion2, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21],
     variant: erosion2, options: {pfmPhiKappa: "0.02"}, warm: "@noPolitics",
     description: "Hold the budget, fading + erosion 2% a year."}
  - {key: holdPrice-erosion5, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21],
     variant: erosion5, options: {pfmPhiKappa: "0.05"}, warm: "@noPolitics",
     description: "Hold the price, fading + erosion 5% a year."}
  - {key: holdBudget-erosion5, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21],
     variant: erosion5, options: {pfmPhiKappa: "0.05"}, warm: "@noPolitics",
     description: "Hold the budget, fading + erosion 5% a year."}
  - {key: holdPrice-erosionHistorical, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21],
     variant: erosionHistorical, options: {pfmPhiKappa: "Bulk=0.011,Diffuse=0.046"}, warm: "@noPolitics",
     description: "Hold the price, fading + the historical narrowing of the gap spread, 1.1% (P&I) and 4.6% (B&T) a year (Supplementary Note S-kappa)."}
  - {key: holdBudget-erosionHistorical, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21],
     variant: erosionHistorical, options: {pfmPhiKappa: "Bulk=0.011,Diffuse=0.046"}, warm: "@noPolitics",
     description: "Hold the budget, fading + the historical per-sector rates (Supplementary Note S-kappa)."}
  - {key: holdPrice-growingLimit, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21],
     variant: growingLimit, options: {pfmPhiHold: ratio, pfmPhiKappa: "-0.005"}, warm: "@noPolitics",
     description: "Hold the price, growing limit: today's limit tightening 0.5% a year (a declared bound, ADR 0057)."}
  - {key: holdBudget-growingLimit, wave: 1, section: v8_persistence, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21],
     variant: growingLimit, options: {pfmPhiHold: ratio, pfmPhiKappa: "-0.005"}, warm: "@noPolitics",
     description: "Hold the budget, growing limit (ADR 0057). In v7 it met the budget at 2100 but did not peak: disclosed."}

  # ---------------------------------------------------------------- the institutions (ADR 0063)
  - {key: holdPrice-institutionsHeld, wave: 1, section: v8_institutions, parent: PkBudg1000, rule: holdPrice, theta: "0.50",
     variant: institutionsHeld, institutions: hold, warm: "@noPolitics",
     description: "Hold the price, institutions held at their 2023 values: bounds the P&I institution channel (design note 0009 section 19)."}
  - {key: holdBudget-institutionsHeld, wave: 1, section: v8_institutions, parent: PkBudg1000, rule: holdBudget, theta: "0.50",
     variant: institutionsHeld, institutions: hold, warm: "@noPolitics",
     description: "Hold the budget, institutions held at their 2023 values."}
  - {key: holdPrice-institutionsAndrijevic, wave: 1, section: v8_institutions, parent: PkBudg1000, rule: holdPrice, theta: "0.50",
     variant: institutionsAndrijevic, institutions: gapclosureAndrijevic, warm: "@noPolitics",
     description: "Hold the price, gap closure with government effectiveness from Andrijevic et al. 2020 SSP2 (ADR 0063 sensitivity)."}
  - {key: holdBudget-institutionsAndrijevic, wave: 1, section: v8_institutions, parent: PkBudg1000, rule: holdBudget, theta: "0.50",
     variant: institutionsAndrijevic, institutions: gapclosureAndrijevic, warm: "@noPolitics",
     description: "Hold the budget, gap closure with Andrijevic's government effectiveness (ADR 0063 sensitivity)."}
  - {key: holdPrice-institutionsStoryline, wave: 1, section: v8_institutions, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21],
     variant: institutionsStoryline, institutions: storyline, warm: "@noPolitics",
     description: "Hold the price, the previous storyline-convergence rule ('quick convergence', ADR 0063 alternative)."}
  - {key: holdBudget-institutionsStoryline, wave: 1, section: v8_institutions, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21],
     variant: institutionsStoryline, institutions: storyline, warm: "@noPolitics",
     description: "Hold the budget, the previous storyline-convergence rule ('quick convergence')."}

  # ---------------------------------------------------------------- the shrinking future: hold the price, a chain of five
  # Steps from 2040 on set the start price at the peak year (cm_taxCO2_peakBudgYr, $/t CO2 in cm_peakBudgYr 2080) instead
  # of in cm_startyear. The linear anchor runs from the previous step's price in the last fixed period (path_gdx_ref,
  # max over regions) and REMIND aborts if the start value is below it: 75 $/t in 2040 is below ~135 $/t in 2035
  # (2026-10-30, both 2040 steps). 500 $/t in 2080 is above any price before 2070 on v7 (hold the budget 519 in 2080,
  # 397 in 2065). It is only the first guess: hold the budget re-solves the peak price (algorithm 9), and hold the price
  # replaces the anchor with the no-politics run's (cm_pfmAnchorFromGdx).
  - {key: holdPrice-shrinkingFuture2030, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21],
     variant: shrinkingFuture2030, options: {pfmPhiWindowEnd: "2040"}, warm: "@noPolitics",
     description: "Shrinking future, hold the price, step 1: the past fixed to current policies (2025), the cap only in 2030-2035, the future after it planned unconstrained."}
  - {key: holdPrice-shrinkingFuture2040, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21], start: {EU21: V8SEQEU21},
     variant: shrinkingFuture2040, options: {pfmPhiWindowEnd: "2050"},
     set: {cm_startyear: "2040", cm_pfmRefPrice: refpolicycost, cm_taxCO2_startyear: "-1", cm_taxCO2_peakBudgYr: "500", path_gdx_ref: "@holdPrice-shrinkingFuture2030"}, warm: "@holdPrice-shrinkingFuture2030",
     description: "Shrinking future, hold the price, step 2: the past to 2035 fixed to step 1, the cap only in 2040-2045."}
  - {key: holdPrice-shrinkingFuture2050, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21], start: {EU21: V8SEQEU21},
     variant: shrinkingFuture2050, options: {pfmPhiWindowEnd: "2060"},
     set: {cm_startyear: "2050", cm_pfmRefPrice: refpolicycost, cm_taxCO2_startyear: "-1", cm_taxCO2_peakBudgYr: "500", path_gdx_ref: "@holdPrice-shrinkingFuture2040"}, warm: "@holdPrice-shrinkingFuture2040",
     description: "Shrinking future, hold the price, step 3: the past to 2045 fixed to step 2, the cap only in 2050-2055."}
  - {key: holdPrice-shrinkingFuture2060, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21], start: {EU21: V8SEQEU21},
     variant: shrinkingFuture2060, options: {pfmPhiWindowEnd: "2070"},
     set: {cm_startyear: "2060", cm_pfmRefPrice: refpolicycost, cm_taxCO2_startyear: "-1", cm_taxCO2_peakBudgYr: "500", path_gdx_ref: "@holdPrice-shrinkingFuture2050"}, warm: "@holdPrice-shrinkingFuture2050",
     description: "Shrinking future, hold the price, step 4: the past to 2055 fixed to step 3, the cap only in 2060."}
  - {key: holdPrice-shrinkingFuture2070, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdPrice, theta: "0.50", res: [EU21], start: {EU21: V8SEQEU21},
     variant: shrinkingFuture2070, options: {},
     set: {cm_startyear: "2070", cm_pfmRefPrice: refpolicycost, cm_taxCO2_startyear: "-1", cm_taxCO2_peakBudgYr: "500", path_gdx_ref: "@holdPrice-shrinkingFuture2060"}, warm: "@holdPrice-shrinkingFuture2060",
     description: "Shrinking future, hold the price, last step: the past to 2060 fixed to step 4, the cap from 2070 on. The chain's result."}

  # ---------------------------------------------------------------- the shrinking future: hold the budget, a chain of five
  - {key: holdBudget-shrinkingFuture2030, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21],
     variant: shrinkingFuture2030, options: {pfmPhiWindowEnd: "2040"}, warm: "@noPolitics",
     description: "Shrinking future, hold the budget, step 1: the cap only in 2030-2035, the rest of the budget planned unconstrained."}
  - {key: holdBudget-shrinkingFuture2040, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21], start: {EU21: V8RERUNEU21},
     variant: shrinkingFuture2040, options: {pfmPhiWindowEnd: "2050"},
     set: {cm_startyear: "2040", cm_pfmRefPrice: refpolicycost, cm_taxCO2_startyear: "-1", cm_taxCO2_peakBudgYr: "500", path_gdx_ref: "@holdBudget-shrinkingFuture2030"}, warm: "@holdBudget-shrinkingFuture2030",
     description: "Shrinking future, hold the budget, step 2: the past to 2035 fixed to step 1, the cap only in 2040-2045."}
  - {key: holdBudget-shrinkingFuture2050, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21], start: {EU21: V8RERUNEU21},
     variant: shrinkingFuture2050, options: {pfmPhiWindowEnd: "2060"},
     set: {cm_startyear: "2050", cm_pfmRefPrice: refpolicycost, cm_taxCO2_startyear: "-1", cm_taxCO2_peakBudgYr: "500", path_gdx_ref: "@holdBudget-shrinkingFuture2040"}, warm: "@holdBudget-shrinkingFuture2040",
     description: "Shrinking future, hold the budget, step 3: the past to 2045 fixed to step 2, the cap only in 2050-2055."}
  - {key: holdBudget-shrinkingFuture2060, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21], start: {EU21: V8RERUNEU21},
     variant: shrinkingFuture2060, options: {pfmPhiWindowEnd: "2070"},
     set: {cm_startyear: "2060", cm_pfmRefPrice: refpolicycost, cm_taxCO2_startyear: "-1", cm_taxCO2_peakBudgYr: "500", path_gdx_ref: "@holdBudget-shrinkingFuture2050"}, warm: "@holdBudget-shrinkingFuture2050",
     description: "Shrinking future, hold the budget, step 4: the past to 2055 fixed to step 3, the cap only in 2060."}
  - {key: holdBudget-shrinkingFuture2070, wave: 1, section: v8_sequential, parent: PkBudg1000, rule: holdBudget, theta: "0.50", res: [EU21], start: {EU21: V8RERUNEU21},
     variant: shrinkingFuture2070, options: {},
     set: {cm_startyear: "2070", cm_pfmRefPrice: refpolicycost, cm_taxCO2_startyear: "-1", cm_taxCO2_peakBudgYr: "500", path_gdx_ref: "@holdBudget-shrinkingFuture2060"}, warm: "@holdBudget-shrinkingFuture2060",
     description: "Shrinking future, hold the budget, last step: the past to 2060 fixed to step 4, the cap from 2070 on, the budget met in what is left. The chain's result."}

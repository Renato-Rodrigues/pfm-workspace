# The v6 coupled batch as a matrix (ADR 0055; design note 0005 F1 / E16, Phase 5, first and second batch).
# Descriptions use the labels of docs/SCENARIOS.md 2.6 (hold the price / hold the budget; growing, constant
# and fading limit; fading + erosion). Keys, stems, `rule:` and `wave:` are identifiers and keep their names:
# Bfix = hold the price, C = hold the budget.
#
# Build:  Rscript analysis/run-groups/buildPFMScenarioConfig.R
# It writes models/remind_pfm/config/scenario_config_PFM_v6.csv - a BUILD ARTIFACT: edit this file,
# rebuild, commit both. config/scenario_config_PFM.csv stays the hand-maintained v5 record (plus the
# 3.7.1 bases and the Phase 3 gate rows it was submitted with).
#
# Every row is its canonical REMIND parent (config/scenario_config.csv, "<ssp>-<from>") plus the
# deltas named here, nothing else. "@key" = the title of run/parent `key` of the same SSP and
# resolution. A theta list expands; the thetaDefault row carries no Th suffix and is what "@key"
# points at. The generator never writes cm_iteration_max (author's rule, 2026-10-01).
#
# Start tags: V6W<wave><res> per batch and resolution (e.g. V6W1H12); <res>BASE for the parents.
# The EU21 rows already run in the Phase 3 gate keep the gate's tag, so V6W1EU21 does not re-run them.
# SSP axis (third batch) is deferred (0005 section 7a decision 7): add SSP1/SSP3 to `ssps` when it comes.

format: pfm-scenario-matrix/1
output: config/scenario_config_PFM_v6.csv
canonical: config/scenario_config.csv
version: v6
ssps: [SSP2]
thetaDefault: "0.50"

resolutions:
  EU21:
    infix: EU21
    set:
      regionmapping: ./config/regionmapping_21_EU11.csv
      extramappings_historic: ./config/extramapping_EU27.csv
    baseStart: [EU21BASE]            # the 3.7.1 EU21 bases ran with EU21V371 (2026-10-07)
  H12:
    infix: ""
    set: {}
    baseStart: [H12BASE, V6W1H12]    # not yet run on 3.7.1: the first batch at H12 starts them first

parents:
  NPi2025:
    from: NPi2025
    set:
      cm_taxCO2_lowerBound_path_gdx_ref: "0"
  PkBudg1000:
    from: PkBudg1000
    set:
      cm_taxCO2_lowerBound_path_gdx_ref: "0"
      path_gdx_ref: "@NPi2025"
      path_gdx_refpolicycost: "@NPi2025"

coupled:                              # on every coupled row
  cm_taxCO2_regiDiff: "11"
  cm_pfmConvTol: "0.002"
  cm_pfmSectorMarkup: "1"
  cm_pfmGapClosure: "0"               # lambda is out of the coupling (ADR 0050)
  cm_pfmPhiPath: "1"                  # the v6 share path (ADR 0054)
  pfmGroup: v6

rules:
  gate:                               # no-politics reference (theta = 0), budget held, proportional mode
    stem: PFMgate
    set: {cm_pfmBindMode: "1", cm_pfmTheta: "0"}
  gateBfix:                           # no-politics reference, price held: anchor pinned from -PFMgate
    stem: PFMgateBfix
    set: {cm_iterative_target_adj: "0", cm_pfmBindMode: "1", cm_pfmTheta: "0", cm_pfmAnchorFromGdx: "on",
          path_gdx_carbonprice: "@gate"}
  Bfix:                               # hold the price: level cap, anchor pinned from -PFMgate
    stem: PFMlevelBfix
    set: {cm_iterative_target_adj: "0", cm_pfmBindMode: "2", cm_pfmAnchorFromGdx: "on",
          path_gdx_carbonprice: "@gate"}
  C:                                  # hold the budget: level cap rebuilt in GAMS every iteration
    stem: PFMlevelC
    set: {cm_pfmBindMode: "2", cm_pfmBoundRebuild: "1"}
  ratio:                              # proportional mode, budget held (v5 continuity)
    stem: PFMratio
    set: {cm_pfmBindMode: "1"}

runs:
  # ---------------------------------------------------------------- first batch (wave 1)
  - key: gateRef
    section: wave1_nulls
    parent: PkBudg1000
    stem: PFMgateRef
    coupled: false
    set: {cm_taxCO2_regiDiff: "0"}
    description: >-
      Uniform global price, uncoupled: the same-version comparator of the no-politics reference
      (SCENARIOS.md 3.1, PITFALLS.md 34).
  - key: gate
    wave: 1
    section: wave1_nulls
    parent: PkBudg1000
    rule: gate
    start: {EU21: [EU21V6GATE]}
    warm: null
    description: >-
      No-politics reference (theta = 0), budget held (D18): must reproduce -PFMgateRef within
      SCENARIOS.md 3.1. Anchor and price donor of every hold-the-price row.
  - key: gateBfix
    wave: 1
    section: wave1_nulls
    parent: PkBudg1000
    rule: gateBfix
    warm: "@gate"
    start: {EU21: [EU21V6GATE]}
    description: "No-politics reference (theta = 0), price held: the comparator of every hold-the-price row."
  - key: Bfix
    wave: 1
    section: wave1_ruleB
    parent: PkBudg1000
    rule: Bfix
    theta: "0.50"
    warm: "@gateBfix"
    start: {EU21: [EU21V6GATE]}         # ran in the Phase 3 gate
    description: "Hold the price, fading limit, theta 0.50: the headline (extra CO2 against -PFMgateBfix)."
  - key: Bfix
    wave: 1
    section: wave1_ruleB
    parent: PkBudg1000
    rule: Bfix
    theta: ["0.325", "0.675"]
    warm: "@Bfix"
    description: "Hold the price, fading limit, at the other two declared severities."
  - key: C
    wave: 1
    section: wave1_ruleC
    parent: PkBudg1000
    rule: C
    theta: "0.50"
    start: {EU21: [EU21V6GATE]}         # ran in the Phase 3 gate
    description: "Hold the budget, fading limit, theta 0.50: the cap rebuilt from the share path every iteration."
  - key: C
    wave: 1
    section: wave1_ruleC
    parent: PkBudg1000
    rule: C
    theta: ["0.325", "0.675"]
    warm: "@C"
    description: "Hold the budget, fading limit, at the other two declared severities."
  - key: Bheld
    wave: 1
    section: wave1_institutionsHeld
    parent: PkBudg1000
    rule: Bfix
    theta: "0.50"
    variant: held
    institutions: hold
    warm: "@Bfix"
    description: >-
      Hold the price, fixed institutions (held at their anchor values, 0005 section 7a decision 1A):
      institutions carry about half of the power & industry strength's 2100 fall.
  - key: Cheld
    wave: 1
    section: wave1_institutionsHeld
    parent: PkBudg1000
    rule: C
    theta: "0.50"
    variant: held
    institutions: hold
    warm: "@C"
    description: "Hold the budget, fixed institutions (decision 1A)."

  # ---------------------------------------------------------------- second batch (wave 2)
  - {key: Buniform, wave: 2, section: wave2_ordering, parent: PkBudg1000, rule: Bfix, theta: "0.50",
     variant: uniform, options: {pfmPhiOrdering: uniform}, warm: "@gateBfix",
     description: "Hold the price, ranking test (D15): uniform shares - the size of the effect without its location."}
  - {key: Bperm1, wave: 2, section: wave2_ordering, parent: PkBudg1000, rule: Bfix, theta: "0.50",
     variant: permuted1, options: {pfmPhiOrdering: permuted, pfmPhiOrderingSeed: "1"}, warm: "@gateBfix",
     description: "Hold the price, ranking test (D15): the regions' ranking permuted, seed 1."}
  - {key: Bperm2, wave: 2, section: wave2_ordering, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: permuted2, options: {pfmPhiOrdering: permuted, pfmPhiOrderingSeed: "2"}, warm: "@gateBfix",
     description: "Hold the price, ranking test (D15): permuted, seed 2."}
  - {key: Bperm3, wave: 2, section: wave2_ordering, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: permuted3, options: {pfmPhiOrdering: permuted, pfmPhiOrderingSeed: "3"}, warm: "@gateBfix",
     description: "Hold the price, ranking test (D15): permuted, seed 3."}
  - {key: Brev, wave: 2, section: wave2_ordering, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: reversed, options: {pfmPhiOrdering: reversed}, warm: "@gateBfix",
     description: "Hold the price, ranking test (D15): ranking reversed."}
  - {key: Cuniform, wave: 2, section: wave2_ordering, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: uniform, options: {pfmPhiOrdering: uniform},
     description: "Hold the budget, ranking test (D15): uniform shares."}
  - {key: Cperm1, wave: 2, section: wave2_ordering, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: permuted1, options: {pfmPhiOrdering: permuted, pfmPhiOrderingSeed: "1"},
     description: "Hold the budget, ranking test (D15): permuted, seed 1."}

  - {key: Ballmedian, wave: 2, section: wave2_assignment, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: allmedian, group: v6-allmedian, warm: "@gateBfix",
     description: "Hold the price, uncovered countries (D-M2 ii): every country at the median quality class."}
  - {key: Balllow, wave: 2, section: wave2_assignment, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: alllow, group: v6-alllow, warm: "@gateBfix",
     description: "Hold the price, uncovered countries: every country at the low quality class."}
  - {key: Bnearest, wave: 2, section: wave2_assignment, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: nearest, group: v6-nearest, warm: "@gateBfix",
     description: "Hold the price, uncovered countries: nearest donors always (0005 section 7a decision 3) - moves LAM and SSA in the ranking, not k."}
  - {key: Busadonor, wave: 2, section: wave2_assignment, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: usadonor, group: v6-usadonor, warm: "@gateBfix",
     description: "Hold the price, uncovered countries: the USA as a donor (GP-3 / 10)."}
  - {key: Busalow, wave: 2, section: wave2_assignment, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: usalow, group: v6-usalow, warm: "@gateBfix",
     description: "Hold the price, uncovered countries: the USA in the low class (GP-3 / 10)."}
  - {key: Callmedian, wave: 2, section: wave2_assignment, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: allmedian, group: v6-allmedian, description: "Hold the budget, uncovered countries: all at the median class."}
  - {key: Calllow, wave: 2, section: wave2_assignment, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: alllow, group: v6-alllow, description: "Hold the budget, uncovered countries: all at the low class."}
  - {key: Cnearest, wave: 2, section: wave2_assignment, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: nearest, group: v6-nearest, description: "Hold the budget, uncovered countries: nearest donors always."}

  - {key: BMin, wave: 2, section: wave2_markupAndRatio, parent: PkBudg1000, rule: Bfix, theta: "0.50",
     markup: 0, warm: "@Bfix", description: "Hold the price, markup off: one price across a region's markets (the old min(), v5 continuity)."}
  - {key: CMin, wave: 2, section: wave2_markupAndRatio, parent: PkBudg1000, rule: C, theta: "0.50",
     markup: 0, warm: "@C", description: "Hold the budget, markup off: one price across a region's markets (v5 continuity)."}
  - {key: ratio, wave: 2, section: wave2_markupAndRatio, parent: PkBudg1000, rule: ratio, theta: "0.50",
     description: "Proportional mode (each region pays phi times the global price), budget held, with the share path - v5 continuity."}

  - {key: Bsat05, wave: 2, section: wave2_familyA_shape, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: sat05, group: v6-sat05, warm: "@gateBfix",
     description: "Hold the price, curve shape (decision 6): saturation at 0.5x the median."}
  - {key: Bsat2, wave: 2, section: wave2_familyA_shape, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: sat2, group: v6-sat2, warm: "@gateBfix",
     description: "Hold the price, curve shape (decision 6): saturation at 2x the median."}

  - {key: Bspecalt, wave: 2, section: wave2_familyB, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: specalt, group: v6-specalt, warm: "@gateBfix",
     description: "Hold the price, only innovators saturate (SI): X-2079 satInn, the bootstrap's most frequent winner of that family."}
  - {key: Cspecalt, wave: 2, section: wave2_familyB, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: specalt, group: v6-specalt, description: "Hold the budget, only innovators saturate (SI)."}
  - {key: Bannual, wave: 2, section: wave2_familyB, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: annual, group: v6-annual, warm: "@gateBfix",
     description: "Hold the price, annual data (D3, A6): the sibling Run-Group v6-annual."}

  - {key: BEhold, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21, H12],
     variant: Ehold, options: {pfmPhiHold: ratio}, warm: "@Bfix", start: {H12: V6PERSH12},
     description: "Hold the price, constant limit (D2, C5): today's limit kept, k close to 1."}
  # Added 2026-10-10 after the batch (0005 Phase 6 step 1): the hold-the-budget relocation falls from 76.7 (v5)
  # to 22.7 Gt (v6), almost all after 2050. This variant of BEhold separates the fading limit from the new
  # ranking. Its own start tag, so it never re-runs the second batch.
  - {key: CEhold, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21, H12],
     variant: Ehold, options: {pfmPhiHold: ratio}, warm: "@C", start: {EU21: V6CEHOLD, H12: V6PERSH12},
     description: "Hold the budget, constant limit (D2, C5): today's limit kept, strength vs ranking (0005 Phase 6)."}
  - {key: Bhold2060, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: hold2060, options: {pfmPhiHoldYear: "2060"}, warm: "@Bfix",
     description: "Hold the price, drivers stop in 2060 (D6)."}
  - {key: Chold2060, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: hold2060, options: {pfmPhiHoldYear: "2060"}, warm: "@C",
     description: "Hold the budget, drivers stop in 2060 (D6)."}
  - {key: Bregk, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: regk, options: {pfmPhiStrength: regional}, warm: "@Bfix",
     description: "Hold the price, regional strength k_r (D16, C4), SI."}
  # kappa, the erosion rate: DECLARED 2026-10-08 (author; ADR 0050), before any second-batch run. Central
  # 0.027 a year = "beyond what the drivers already do, the political limit halves by mid-century"
  # (half-life 25 years); the sensitivities 0.02 (half-life ~35 years) and 0.05 (~14 years) bracket it.
  # Both closures each.
  # Counted from t0 = 2025 (decided 2026-10-09): no effect in 2025, an effect from 2030, REMIND's first free period.
  - {key: Bkappa, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21, H12],
     variant: kappa, options: {pfmPhiKappa: "0.027"}, warm: "@Bfix", start: {H12: V6PERSH12},
     description: "Hold the price, fading + erosion 2.7% a year (kappa = 0.027, the central erosion rate, D13, C2) - replaces GAPCLOSE."}
  - {key: Ckappa, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21, H12],
     variant: kappa, options: {pfmPhiKappa: "0.027"}, warm: "@C", start: {H12: V6PERSH12},
     description: "Hold the budget, fading + erosion 2.7% a year (kappa = 0.027, the central erosion rate)."}
  - {key: Bkappa02, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: kappa02, options: {pfmPhiKappa: "0.02"}, warm: "@Bfix",
     description: "Hold the price, fading + erosion 2% a year (kappa = 0.02, half-life about 35 years)."}
  - {key: Ckappa02, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: kappa02, options: {pfmPhiKappa: "0.02"}, warm: "@C",
     description: "Hold the budget, fading + erosion 2% a year (kappa = 0.02)."}
  - {key: Bkappa05, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: kappa05, options: {pfmPhiKappa: "0.05"}, warm: "@Bfix",
     description: "Hold the price, fading + erosion 5% a year (kappa = 0.05, half-life about 14 years)."}
  - {key: Ckappa05, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: kappa05, options: {pfmPhiKappa: "0.05"}, warm: "@C",
     description: "Hold the budget, fading + erosion 5% a year (kappa = 0.05)."}
  # Added 2026-10-12 for the paper frames (design note 0006): the persistence ladder at H12 (start tag
  # V6PERSH12 on the H12 variants of BEhold, CEhold, Bkappa, Ckappa above) and the growing limit, the strength
  # GROWING above today's: the constant limit (k = 1) times (1 - kappa)^(t - 2025) with kappa < 0. PROPOSED VALUE
  # -0.005 a year (k = 1.13 in 2050, 1.45 in 2100; the top-ranked share 1 - 0.5 k stays above 0.27) - the
  # author declares it before submission, as kappa was declared (ADR 0050). Own tag, EU21 only.
  - {key: Bbackslide, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: Bfix, theta: "0.50", res: [EU21],
     variant: backslide, options: {pfmPhiHold: ratio, pfmPhiKappa: "-0.005"}, warm: "@BEhold", start: {EU21: V6BACK},
     description: "Hold the price, growing limit (0006): today's limit tightening 0.5% a year."}
  - {key: Cbackslide, wave: 2, section: wave2_formulation, parent: PkBudg1000, rule: C, theta: "0.50", res: [EU21],
     variant: backslide, options: {pfmPhiHold: ratio, pfmPhiKappa: "-0.005"}, warm: "@CEhold", start: {EU21: V6BACK},
     description: "Hold the budget, growing limit (0006): today's limit tightening 0.5% a year."}
